<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Rohit Hair Cutting</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --primary-color: #d4af37;
      --secondary-color: #111111;
      --accent-color: #27ae60;
      --bg-color: #f4f6f9;
      --text-color: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
    }

    .login-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      width: 100%;
      max-width: 380px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .login-card h2 {
      margin-bottom: 8px;
      color: var(--secondary-color);
    }

    .login-card p {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 15px;
      outline: none;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      background: var(--secondary-color);
      color: var(--primary-color);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    header {
      background: var(--secondary-color);
      color: #fff;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--primary-color);
    }

    header h1 {
      font-size: 22px;
      color: var(--primary-color);
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .stat-card i {
      font-size: 32px;
      color: var(--primary-color);
    }

    .stat-info h3 {
      font-size: 22px;
      color: #111;
    }

    .stat-info p {
      font-size: 13px;
      color: #777;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .controls input {
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      width: 100%;
      max-width: 300px;
      font-size: 14px;
    }

    .table-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #fafafa;
      color: #555;
      font-weight: 600;
    }

    tr:hover {
      background: #fdfdfd;
    }

    .badge {
      background: #eef9f1;
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-wa {
      background: #25D366;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    @media(max-width: 768px) {
      header { flex-direction: column; gap: 10px; text-align: center; }
      .controls input { max-width: 100%; }
    }
  </style>
</head>


<body>

  <div class="login-overlay" id="loginModal">
    <div class="login-card">
      <h2>Shopkeeper Login</h2>
      <p>Rohit Hair Cutting Admin Dashboard</p>
      <input type="password" id="adminPassword" placeholder="Enter Password" />
      <button onclick="checkPassword()">Login</button>
    </div>
  </div>

  <header>
    <h1><i class="fa-solid fa-scissors"></i> Rohit Hair Cutting Admin</h1>
    <button onclick="location.reload()" style="background:#333; color:#fff; border:none; padding:8px 15px; border-radius:6px; cursor:pointer;">
      <i class="fa-solid fa-rotate-right"></i> Refresh
    </button>
  </header>

  <div class="container">

    <div class="stats-grid">
      <div class="stat-card">
        <i class="fa-solid fa-calendar-check"></i>
        <div class="stat-info">
          <h3 id="totalBookings">0</h3>
          <p>Total Bookings</p>
        </div>
      </div>

      <div class="stat-card">
        <i class="fa-solid fa-indian-rupee-sign"></i>
        <div class="stat-info">
          <h3 id="totalRevenue">₹0</h3>
          <p>Advance Collected (₹49/booking)</p>
        </div>
      </div>
    </div>

    <div class="controls">
      <h2 style="font-size:18px;">All Appointments</h2>
      <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search Name, Mobile, or Date..." />
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Service</th>
            <th>Address</th>
            <th>Txn ID / UTR</th>
            <th>Status</th>
            <th>Contact</th>
          </tr>
        </thead>
        <tbody id="bookingsTableBody">
          <tr>
            <td colspan="8" style="text-align:center; color:#999; padding:20px;">Loading bookings...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // ⚠️ Is jagah apni Firebase Keys paste karein (Same as index.html)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkPassword = function() {
      const pass = document.getElementById("adminPassword").value;
      if (pass === "rohit123") {
        document.getElementById("loginModal").style.display = "none";
        loadBookings();
      } else {
        alert("Galat Password! Kripya sahi password enter karein.");
      }
    };

    async function loadBookings() {
      const tableBody = document.getElementById("bookingsTableBody");
      tableBody.innerHTML = "";

      try {
        const q = query(collection(db, "appointments"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        let count = 0;
        let revenue = 0;

        if (querySnapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Abhi koi booking nahi aayi hai.</td></tr>`;
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          count++;
          revenue += (data.advanceAmount || 49);

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${data.date || '-'}</strong><br><small style="color:#666;">${data.time || '-'}</small></td>
            <td><strong>${data.name || '-'}</strong></td>
            <td>${data.mobile || '-'}</td>
            <td>${data.service || '-'}</td>
            <td>${data.address || '-'}</td>
            <td><code style="background:#eee; padding:2px 6px; border-radius:4px;">${data.transactionId || '-'}</code></td>
            <td><span class="badge">Paid ₹49</span></td>
            <td>
              <a href="https://wa.me/91${data.mobile}?text=Hi%20${encodeURIComponent(data.name)},%20Rohit%20Hair%20Cutting%20se%20aapka%20appointment%20confirm%20ho%20gaya%20hai." target="_blank" class="btn-wa">
                <i class="fa-brands fa-whatsapp"></i> Chat
              </a>
            </td>
          `;
          tableBody.appendChild(tr);
        });

        document.getElementById("totalBookings").innerText = count;
        document.getElementById("totalRevenue").innerText = `₹${revenue}`;

      } catch (error) {
        console.error("Error loading bookings: ", error);
        tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:red;">Data load karne me error: ${error.message}</td></tr>`;
      }
    }

    window.filterTable = function() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#bookingsTableBody tr");

      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
      });
    };
  </script>

</body>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB1F8o158Z4cT3_QGrfCNCXp5qeHNbh6J0",
    authDomain: "rohit-hair-cutting.firebaseapp.com",
    projectId: "rohit-hair-cutting",
    storageBucket: "rohit-hair-cutting.firebasestorage.app",
    messagingSenderId: "184279547945",
    appId: "1:184279547945:web:0d94e94a532e9e02fc5c38"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const appointmentsList = document.querySelector('#appointments-list'); // Table/List ka container ID

  // Real-time appointment fetch
  const q = query(collection(db, "appointments"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    if (appointmentsList) {
      appointmentsList.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        appointmentsList.innerHTML += `
          <tr>
            <td>${data.name}</td>
            <td>${data.phone}</td>
            <td>${data.service}</td>
            <td>${data.date}</td>
          </tr>
        `;
      });
    }
  });
  </script>
  
</html>
