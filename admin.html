<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Rohit Hair Cutting</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --primary-color: #d4af37;
      --secondary-color: #111111;
      --accent-color: #27ae60;
      --bg-color: #f8f9fa;
      --text-color: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    /* Login Modal Styles */
    .login-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border-top: 4px solid var(--primary-color);
    }

    .login-card h2 {
      margin-bottom: 8px;
      font-size: 22px;
      color: var(--secondary-color);
    }

    .login-card p {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 15px;
      outline: none;
    }

    .login-card input:focus {
      border-color: var(--primary-color);
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      background: var(--secondary-color);
      color: var(--primary-color);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .login-card button:hover {
      background: #000;
    }

    .error-msg {
      color: #dc3545;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    /* Admin Content */
    .admin-container {
      display: none; /* Login hone ke baad visible hoga */
    }

    .header {
      background: var(--secondary-color);
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 3px solid var(--primary-color);
    }

    .header h1 {
      font-size: 24px;
      color: var(--primary-color);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .refresh-btn {
      background: var(--primary-color);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-container {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
    }

    th {
      background-color: #f1f3f5;
      font-weight: 600;
      color: #555;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .badge-paid {
      background: #eef9f1;
      color: #1e7e34;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid #c3e6cb;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-delete:hover {
      background: #bd2130;
    }

    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Password Protected Screen -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <i class="fa-solid fa-lock fa-2x" style="color: var(--primary-color); margin-bottom: 12px;"></i>
      <h2>Admin Login</h2>
      <p>Rohit Hair Cutting Dashboard</p>

      <form id="loginForm">
        <input type="password" id="adminPassword" placeholder="Enter Admin Password" required autofocus>
        <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      </form>
      <div class="error-msg" id="loginError">Incorrect Password! Try again.</div>
    </div>
  </div>

  <!-- Protected Admin Dashboard Content -->
  <div class="admin-container" id="adminContainer">
    <div class="header">
      <h1><i class="fa-solid fa-user-shield"></i> Rohit Hair Cutting - Admin Panel</h1>
      <div class="header-actions">
        <button class="refresh-btn" onclick="fetchAppointments()">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
        <button class="logout-btn" onclick="logoutAdmin()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>

    <div class="table-container">
      <table id="appointmentsTable">
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Service</th>
            <th>Date</th>
            <th>Time</th>
            <th>Address</th>
            <th>Advance Paid</th>
            <th>Transaction ID</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="11" class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading Appointments...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1F8o158Z4cT3_QGrfCNCXp5qeHNbh6J0",
      authDomain: "rohit-hair-cutting.firebaseapp.com",
      projectId: "rohit-hair-cutting",
      storageBucket: "rohit-hair-cutting.firebasestorage.app",
      messagingSenderId: "184279547945",
      appId: "1:184279547945:web:0d94e94a532e9e02fc5c38"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PASS_KEY = "rohithasmi@123";

    const loginForm = document.getElementById("loginForm");
    const loginOverlay = document.getElementById("loginOverlay");
    const adminContainer = document.getElementById("adminContainer");
    const loginError = document.getElementById("loginError");

    // Login Check Event
    loginForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const enteredPassword = document.getElementById("adminPassword").value.trim();

      if (enteredPassword === PASS_KEY) {
        sessionStorage.setItem("adminLoggedIn", "true");
        unlockAdminPanel();
      } else {
        loginError.style.display = "block";
        document.getElementById("adminPassword").value = "";
      }
    });

    function unlockAdminPanel() {
      loginOverlay.style.display = "none";
      adminContainer.style.display = "block";
      fetchAppointments();
    }

    window.logoutAdmin = function() {
      sessionStorage.removeItem("adminLoggedIn");
      location.reload();
    };

    window.fetchAppointments = async function() {
      const tableBody = document.getElementById("tableBody");
      tableBody.innerHTML = `<tr><td colspan="11" class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading Appointments...</td></tr>`;

      try {
        const q = query(collection(db, "appointments"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="11" class="empty-msg">Koi new appointment nahi mila.</td></tr>`;
          return;
        }

        let html = "";
        querySnapshot.forEach((docSnapshot) => {
          const data = docSnapshot.data();
          const docId = docSnapshot.id;

          html += `
            <tr>
              <td><strong>${docId}</strong></td>
              <td>${data.name || 'N/A'}</td>
              <td><a href="tel:${data.mobile}" style="color:#007bff; text-decoration:none;">${data.mobile || 'N/A'}</a></td>
              <td>${data.service || 'N/A'}</td>
              <td>${data.date || 'N/A'}</td>
              <td>${data.time || 'N/A'}</td>
              <td>${data.address || 'N/A'}</td>
              <td><strong style="color:var(--accent-color);">₹${data.advanceAmount || 1}</strong></td>
              <td><code>${data.transactionId || 'N/A'}</code></td>
              <td><span class="badge-paid">${data.paymentStatus || 'Completed'}</span></td>
              <td>
                <button class="btn-delete" onclick="deleteAppointment('${docId}')">
                  <i class="fa-solid fa-trash"></i> Delete
                </button>
              </td>
            </tr>
          `;
        });

        tableBody.innerHTML = html;

      } catch (error) {
        console.error("Error fetching data: ", error);
        tableBody.innerHTML = `<tr><td colspan="11" class="empty-msg" style="color:red;">Data load karne me error aayi: ${error.message}</td></tr>`;
      }
    };

    window.deleteAppointment = async function(id) {
      if (confirm("Kya aap sach me is appointment ko delete karna chahte hain?")) {
        try {
          await deleteDoc(doc(db, "appointments", id));
          alert("Appointment delete ho gaya!");
          fetchAppointments();
        } catch (error) {
          alert("Delete me error aaya: " + error.message);
        }
      }
    };

    // Auto Login Check on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem("adminLoggedIn") === "true") {
        unlockAdminPanel();
      }
    });
  </script>

</body>
</html>
